<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>录入问答</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', filename='rich_editor.css') }}">
    <style>
        :root { --ink-0:#f7f7f5; --ink-1:#111111; --ink-2:#2d2d2d; --ink-3:#707070; }
        body { background:
            radial-gradient(circle at 10% 10%, rgba(0,0,0,0.05), transparent 24%),
            radial-gradient(circle at 90% 0%, rgba(0,0,0,0.04), transparent 18%),
            linear-gradient(180deg, #ffffff 0%, #f4f4f1 100%);
            color: var(--ink-1);
            font-family: "Segoe UI Variable", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        .page { max-width: 1280px; margin: 0 auto; padding: 28px 20px 40px; }
        .panel { background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,247,244,0.96)); border: 1px solid rgba(17,17,17,0.08); border-radius: 28px; box-shadow: 0 18px 40px rgba(17,17,17,0.06); padding: 24px; backdrop-filter: blur(10px); }
        h2 { margin: 0; font-size: 30px; letter-spacing: -0.05em; font-weight: 900; }
        .hero { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid rgba(17,17,17,0.08); }
        .meta { color: var(--ink-3); font-size: 13px; }
        label { display: block; margin: 16px 0 8px; font-weight: 700; color: var(--ink-2); }
        textarea, input[type="text"], select { width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 16px; border: 1px solid rgba(17,17,17,0.10); background: rgba(255,255,255,0.95); }
        .rich-editor-shell { margin-top: 6px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(17,17,17,0.08); box-shadow: 0 12px 28px rgba(17,17,17,0.04); }
        .rich-toolbar { background: linear-gradient(180deg, #ffffff, #f7f7f4); border-bottom: 1px solid rgba(17,17,17,0.06); }
        .rich-editor { background: #fff; min-height: 280px; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
        button, .link-btn { border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 42px; }
        button { background: linear-gradient(135deg, #111111, #363636); color: #fff; box-shadow: 0 10px 24px rgba(17,17,17,0.12); }
        .link-btn { background: rgba(255,255,255,0.92); color: var(--ink-1); border: 1px solid rgba(17,17,17,0.08); }
        .msg { margin-top: 12px; color: #1f1f1f; }
        .help { color: var(--ink-3); font-size: 12px; line-height: 1.6; margin-top: 10px; }
        .info-strip { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
        .info-chip { display:inline-flex; align-items:center; min-height:30px; padding:0 12px; border-radius:999px; background:rgba(17,17,17,0.04); color:var(--ink-2); font-size:12px; border:1px solid rgba(17,17,17,0.06); }
        @media (max-width: 960px) {
            .page { padding: 18px 14px 24px; }
            .panel { padding: 16px; border-radius: 20px; }
            .brand { flex-direction: column; align-items: flex-start; }
            .info-strip { width: 100%; }
            .info-chip { width: 100%; justify-content: center; }
            .actions { flex-direction: column; }
            button, .link-btn { width: 100%; }
            .rich-editor { min-height: 240px; }
        }
        @media (max-width: 640px) {
            h2 { font-size: 24px; }
            label { margin-top: 12px; }
            .rich-toolbar { display:flex; flex-wrap:wrap; gap:8px; padding:10px; }
            .rich-toolbar .tool-hint { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <div class="hero">
                <div class="brand">
                    {{ tenant_brand_html|safe }}
                    <div>
                        <h2>录入新问答</h2>
                        <div class="meta">{{ tenant_name }} · 录入问答</div>
                    </div>
                </div>
                <div class="info-strip">
                    <span class="info-chip">支持图片 / 文件插入</span>
                    <span class="info-chip">公开或内部可控</span>
                    <span class="info-chip">提交后立即进入当前租户库</span>
                </div>
            </div>
            <form id="qaForm" onsubmit="return submitQA(event)">
                <label>问题（标准问法）</label>
                <input id="qa_question" type="text" required>
                <label>答案</label>
                <div class="rich-editor-shell">
                    <div class="rich-toolbar">
                        <button class="tool-btn" type="button" id="insertImageBtn">插入图片</button>
                        <button class="tool-btn" type="button" id="insertFileBtn">插入文件</button>
                        <span class="tool-hint">先把光标放到答案里，再插入文件或图片。</span>
                    </div>
                    <div id="qa_answer_editor" class="rich-editor" contenteditable="true"></div>
                </div>
                <label>是否对外公开</label>
                <select id="qa_public">
                    <option value="true">公开（客户可见）</option>
                    <option value="false">内部（仅员工可见）</option>
                </select>
                {% if role == 'admin' %}
                <label>分类（管理员可见并设置）</label>
                <input id="qa_category" type="text" placeholder="例如：产品、账单、故障排查（可选）">
                {% endif %}
                <label>回答者署名（必填）</label>
                <input id="qa_author" type="text" value="{{ username }}" placeholder="请输入回答者姓名" required>
                <input id="qa_image_picker" type="file" accept="image/*" multiple hidden>
                <input id="qa_file_picker" type="file" multiple hidden>
                <input type="hidden" id="qa_answer_html" name="answer_html">
                <input type="hidden" id="qa_answer_text" name="answer_text">
                <div class="help">支持在答案任意位置插入多张图片和多个文件，文件会保存到本地并可直接打开。界面已按黑白商务风重新整理。</div>
                <div class="actions">
                    <button type="submit">提交</button>
                    <a class="link-btn" href="{{ url_for('chat_page') }}">返回聊天</a>
                    <a class="link-btn" href="{{ url_for('manage_qa') }}">进入管理页</a>
                </div>
            </form>
            <p id="qa_msg" class="msg"></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='rich_editor.js') }}"></script>
    <script>
        const richEditor = initRichEditor({
            editorSelector: '#qa_answer_editor',
            hiddenHtmlSelector: '#qa_answer_html',
            hiddenTextSelector: '#qa_answer_text',
            insertImageBtnSelector: '#insertImageBtn',
            insertFileBtnSelector: '#insertFileBtn',
            imageInputSelector: '#qa_image_picker',
            fileInputSelector: '#qa_file_picker',
            placeholderText: '在这里输入答案，或插入图片/文件',
        });

        function submitQA(e) {
            e.preventDefault();
            var q = document.getElementById('qa_question').value.trim();
            var pub = document.getElementById('qa_public').value === 'true';
            richEditor.update();
            var answerHtml = document.getElementById('qa_answer_html').value;
            var answerText = document.getElementById('qa_answer_text').value.trim();
            var category = '';
            var author = document.getElementById('qa_author').value.trim();
            {% if role == 'admin' %}
            category = document.getElementById('qa_category').value.trim();
            {% endif %}
            if (!q || (!answerText && !answerHtml) || !author) {
                document.getElementById('qa_msg').textContent = '问题、答案和回答者署名不能为空';
                return false;
            }
            function postQA() {
                var payload = {qa: {question: q, answer_html: answerHtml, answer_text: answerText, public: pub, category: category, author: author}};
                fetch("{{ url_for('add_qa') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token_value }}'},
                    body: JSON.stringify(payload)
                })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('qa_msg').textContent = data.message || ('添加成功，当前知识库共 ' + data.count + ' 条');
                    if (data.status === 'ok') {
                        document.getElementById('qa_question').value = '';
                        richEditor.setHtml('');
                        document.getElementById('qa_author').value = '{{ username }}';
                        {% if role == 'admin' %}
                        document.getElementById('qa_category').value = '';
                        {% endif %}
                    }
                });
            }

            postQA();
            return false;
        }
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% include '_mobile_nav.html' %}
</body>
</html>
