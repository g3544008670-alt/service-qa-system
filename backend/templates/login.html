<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 服务智能问答系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}?v=2">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .auth-shell { width: 100%; max-width: 440px; }
        .auth-card { background: var(--panel); border: 1px solid var(--panel-border); box-shadow: var(--shadow); border-radius: 28px; padding: 28px; backdrop-filter: blur(10px); }
        .auth-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; text-align: center; }
        .auth-brand { display: inline-flex; width: fit-content; max-width: 100%; min-height: 0; padding: 6px; border-radius: 24px; background: transparent; border: 0; align-items: center; justify-content: center; overflow: visible; margin: 0 auto; }
        .brand-inner { background: #fff; padding: 14px; border-radius: 14px; border: 1px solid rgba(148,163,184,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); display:flex; align-items:center; justify-content:center; }
        .brand-inner img { width: auto; max-width: 180px; max-height: 72px; object-fit: contain; display: block; }
        .auth-header h1 { margin: 0; font-size: 24px; }
        .auth-header .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
        .auth-copy { margin-bottom: 18px; color: var(--muted); line-height: 1.7; }
        .auth-form { display: grid; gap: 12px; }
        .auth-form input { width: 100%; padding: 14px 16px; font-size: 15px; }
        .auth-form button { width: 100%; padding: 14px 16px; border: 0; border-radius: 14px; font-weight: 700; color: #fff; background: var(--primary); cursor: pointer; }
        .auth-form button:hover { transform: translateY(-1px); }
        .error { color: var(--danger); background: #fff7f7; border: 1px solid #fecaca; padding: 12px 14px; border-radius: 14px; margin: 0 0 14px; }
        .auth-link { display: block; text-align: center; margin-top: 14px; color: var(--primary-dark); text-decoration: none; font-weight: 600; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand">
                    <div class="brand-inner">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="服务智能问答系统">
                    </div>
                </div>
                <div>
                    <h1>服务智能问答系统</h1>
                    <div class="meta">权限分级 · 统一知识管理</div>
                </div>
            </div>
            <div class="auth-copy">使用公司账号登录，支持员工与授权客户访问。</div>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
                <input type="text" name="username" placeholder="用户名" required>
                <input type="password" name="password" placeholder="密码" required>
                <button type="submit">登录</button>
            </form>
            <div style="text-align:center; margin-top:14px;">
                <a class="auth-link" href="{{ url_for('register_page') }}" style="margin-top:0;">没有账号？注册</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    </body>
</html>
